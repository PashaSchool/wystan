# nav-tree — grammar vocabulary for the deterministic nav-tree extractor
# (B78 Seg G, WYSTAN_NAV_PARENT). Mechanisms, not per-repo dictionaries:
# every value here is a FIELD-NAME class or a structural marker, never a
# capability name. Authoring mirror: eval/stacks/nav-tree.yaml (byte-ident).
#
# The extractor reads STATIC exported nav registries (module-registry /
# sidebar nav-config / settings-navigation hooks) as author intent — the
# same class of JSX/TS source product_strings already treats as the
# vendor's product framing. It NEVER reads i18n VALUES (external, like a
# README) — only i18n KEYS, which are code identifiers.

# Literal display-label fields on a nav item / category (value used verbatim,
# incl. lingui/i18next tagged-template macros ``t`X` `` / ``msg`X` ``).
label_keys: [label, title, name, text, heading]

# i18n-KEY label fields: the value is a dotted code identifier
# (``modules.detectionsStudio.name``); the display label is the humanized
# meaningful segment (the i18n VALUE is never read).
i18n_label_keys: [labelKey, titleKey, nameKey, headingKey, labelI18nKey, nameI18nKey]

# Destination fields on a nav item.
href_keys: [path, route, href, to, url]

# Stable-id fields (parent_id source when present).
id_keys: [id, key, slug]

# Nesting keys: an array (or single object) value under one of these turns
# the enclosing object into a nav CATEGORY and its members into SUB-ITEMS.
nest_keys: [pages, children, items, subItems, subitems, sub, links, routes, tabs, entries, sections]

# Icon fields — a strong "rendered by navigation" signal at item grain.
icon_keys: [icon, Icon, iconName, iconKey]

# Const-name suffixes stripped when deriving a category label from an
# exported const name (SETTINGS_SIDEBAR_ITEMS -> "Settings").
const_name_suffixes:
  - _SIDEBAR_ITEMS
  - _NAV_ITEMS
  - _MENU_ITEMS
  - _NAV_CONFIG
  - _NAVIGATION
  - _SECTIONS
  - _ITEMS
  - _SIDEBAR
  - _NAVBAR
  - _MENU
  - _NAV
  - _CONFIG
  - _REGISTRY
  - _MODULES
  - _MODULE
  - _SECTION
  - _LINKS
  - _ROUTES
  - _PAGES
  - _TABS
  - _GROUP
  - _GROUPS

# Trailing generic segments stripped from an i18n key before humanizing
# the meaningful leaf (modules.detectionsStudio.name -> "Media Studio").
i18n_trailing_generic: [name, label, title, key, text, heading, group]

# Consumption prior (file-level): a file is a nav registry when its basename
# carries a marker OR its content carries a nav-render marker. Config arrays
# NOT consumed by navigation live in non-nav files and are never read.
nav_basename_markers: [nav, sidebar, menu, navigation, registry, routes-config]
nav_content_markers:
  - NavLink
  - NavItem
  - Sidebar
  - SidebarItem
  - MenuItem
  - NavigationDrawer
  - navigationItems
  - sidebarItems
  - ModuleDefinition

# Section-landing directory/file segments (WYSTAN_NAV_CATEGORY_DEMOTE).
# A nav-child PF whose EVERY anchor member file sits under one of these
# structural section-index segments is the OVERVIEW/landing shell of its
# nav category (RefApp modules/feature-studio/overview/*), NOT a feature —
# it holds no real journey. These are UNIVERSAL section-index conventions
# (a directory or index-file name), never a per-repo capability word — the
# same data-not-code discipline as journey_step_leaf_tokens.
section_landing_segments: [overview, index, landing, home]

# Settings-FRAME demote (WYSTAN_SETTINGS_FRAME_DEMOTE). A PF whose NAME is a
# generic settings-frame word — never a product entity — that carries 0-1 real
# journeys and whose EVERY anchor member file sits under a settings-context
# ancestor directory is a contentless settings container ('General' on
# cal/papermark/plane/rallly), NOT a feature: the journeys of an entity's
# settings live under THAT entity, not under a shared settings folder (canon
# pf-product-grain-prompt.md, 'settings-as-container'). Both lists are
# CORROBORATION (a candidate narrower + a structural-home test), never the sole
# decision — the low-journey + settings-home + no-entity structural conjuncts
# decide. Frame words are the generic settings tabs that are never a domain
# entity; context segments are the universal settings-ancestor directory
# conventions (NOT a per-repo capability word) — the same data-not-code
# discipline as section_landing_segments. A 'general' code FOLDER that is not
# under a settings ancestor (documenso components/general/, D3 blob) is NOT a
# settings frame and is left untouched by this vocab (structural-home gate).
settings_frame_name_vocab: [general, settings, preferences, advanced, misc]
settings_frame_context_segments: [settings, account, my-account, preferences, admin]

# B95 (2026-07-28) — capability SHARED-re-home vocab. A capability is a shared
# MECHANISM used by the journeys of MANY features (human verification / file
# upload / search / notification — canon pf-product-grain-prompt.md,
# 'Capability (a shared ability)'). Its name TOKENS corroborate the candidate
# (a narrower), never the decision: the demote also requires 0-low OWN journeys
# + no own product-surface + a route:/fdir: (non-ws:) anchor + low cross-feature
# fan-in. A mechanism-word name alone NEVER demotes — a mechanism that IS the
# product (ente photo/file storage, search-as-product) carries real journeys and
# an own nav/product surface and survives (the product-relative demo test).
capability_mechanism_vocab: [captcha, upload, file, search, notification, notifications, auth-verify]
# SDK / integration / embed VETO — a published SDK, an integration, or an
# embeddable connector is B48-sacred and is never a demote target even when its
# name tokens hit the mechanism vocab (twenty 'Twenty SDK' ws:packages/twenty-sdk
# is already vetoed structurally by the non-ws: anchor gate; this is belt-and-
# suspenders on the name).
capability_sdk_veto_vocab: [sdk, integration, integrations, embed, embeds, connector, connectors]

# ── WYSTAN_VUE_NAV_KEYS grammar (vue-mode-only; flag OFF ⇒ never read) ─────
# These extra vocab lists are consulted ONLY by the vue-mode parse lift
# (``build_nav_tree(ctx, vue=True)`` → ``nav_keys_from_nav_tree``), which the
# nav_keys wiring calls solely under ``WYSTAN_VUE_NAV_KEYS``. The default
# (vue=False) parse — the live ``nav_parent`` / ``nav_seam_keys`` path — never
# reads them, so the pre-flag scan stays byte-identical (kill-switch law).
#
# Extra destination field: Vue router-link `:to` sugar and the HoppSmartLink
# `target` prop are the same 'nav DESTINATION' class as href/path/to.
vue_href_keys: [target]
# Extra nav-render markers: a Directus/extension `defineModule({...})` file is
# a module-registry nav declaration even without a nav basename.
vue_nav_content_markers:
  - defineModule
  - VListItem
  - RouterLink
  - HoppSmartLink
# Module-registry wrapper calls: `export default defineModule({id,name,routes})`
# declares ONE top-level nav destination named by its `id` (the module route
# base). The object's `id` is the destination token; `name` is its (i18n) label.
module_registry_calls: [defineModule]

# Confidence stamped on the emitted nav tree (telemetry only).
confidence: 0.85
